name: Build OpenWrt mediatek_filogic IPK

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: '包版本，留空则从 CMakeLists.txt 读取'
        required: false
        type: string
      release:
        description: '包 release，留空则从 CMakeLists.txt 读取'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      release:
        required: false
        type: string

env:
  DEFAULT_SDK_VERSION: "24.10.6"
  SDK_URL: "https://downloads.openwrt.org/releases/24.10.6/targets/mediatek/filogic"
  SDK_NAME: "openwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        id: ver
        run: |
          set -eu
          VERSION="${{ inputs.version }}"
          RELEASE="${{ inputs.release }}"
          if [ -z "${VERSION}" ] || [ -z "${RELEASE}" ]; then
            CMAKE=esurfingclient/main/CMakeLists.txt
            MAJOR=$(sed -n 's/.*set(PROGRAM_VERSION_MAJOR \([0-9][0-9]*\)).*/\1/p' "$CMAKE")
            MINOR=$(sed -n 's/.*set(PROGRAM_VERSION_MINOR \([0-9][0-9]*\)).*/\1/p' "$CMAKE")
            PATCH=$(sed -n 's/.*set(PROGRAM_VERSION_PATCH \([0-9][0-9]*\)).*/\1/p' "$CMAKE")
            CMAKE_RELEASE=$(sed -n 's/.*set(PROGRAM_VERSION_RELEASE \([0-9][0-9]*\)).*/\1/p' "$CMAKE")
            VERSION="${VERSION:-${MAJOR}.${MINOR}.${PATCH}}"
            RELEASE="${RELEASE:-${CMAKE_RELEASE}}"
          fi
          SDK_VERSION="${DEFAULT_SDK_VERSION:-}"
          if [ -z "${VERSION}" ] || [ -z "${RELEASE}" ]; then
            echo "无法解析版本号 VERSION=${VERSION} RELEASE=${RELEASE}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "sdk_version=${SDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} release=${RELEASE} sdk_version=${SDK_VERSION:-<empty>}"

      - name: 更新 Makefile 版本号
        run: |
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${{ steps.ver.outputs.version }}/" esurfingclient/Makefile
          sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=${{ steps.ver.outputs.release }}/" esurfingclient/Makefile

      - name: 安装软件包 (最多重试 3 次)
        run: |
          PACKAGES="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev rsync wget ca-certificates unzip file zstd python3-setuptools swig"
          
          SUCCESS=0
          for i in 1 2 3; do
            echo "尝试 $i: 正在安装 $PACKAGES"
            if apt-get update && apt-get install -y $PACKAGES; then
              echo "✅ 所有软件包已完成安装"
              SUCCESS=1
              break
            fi
            echo "❌ 尝试 $i 失败"
            sleep 3
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ 安装失败：已重试 3 次"
            exit 1
          fi

      - name: 获取 OpenWrt SDK 压缩包缓存
        id: cache-openwrt-sdk
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.SDK_NAME }}.tar.zst
          key: openwrt-mediatek_filogic-ipk-sdk-${{ steps.ver.outputs.sdk_version }}

      - name: 下载 SDK
        if: steps.cache-openwrt-sdk.outputs.cache-hit != 'true'
        run: |
          wget ${{ env.SDK_URL }}/${{ env.SDK_NAME }}.tar.zst -O ${{ env.SDK_NAME }}.tar.zst

      - name: 解压 SDK
        run: |
          tar -I zstd -xf ${{ env.SDK_NAME }}.tar.zst
          mv ${{ env.SDK_NAME }} openwrt-sdk

          cd openwrt-sdk

          make defconfig

      - name: 获取 OpenWrt 缓存
        id: cache-openwrt
        uses: actions/cache@v6
        with:
          path: |
            openwrt-sdk/staging_dir/
            openwrt-sdk/dl/
          key: openwrt-mediatek_filogic-sdk-${{ steps.ver.outputs.sdk_version }}-${{ hashFiles('.configs/mediatek_filogic-ipk.config') }}

      - name: 准备构建配置
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd openwrt-sdk

          scripts/feeds update packages
          
          scripts/feeds install openssl
          scripts/feeds install curl
          
          make defconfig
          
          cat ../.configs/mediatek_filogic-ipk.config >> .config

          make defconfig

      - name: 编译 libopenssl
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd openwrt-sdk
          make package/openssl/compile -j$(nproc)

      - name: 编译 libcurl
        if: steps.cache-openwrt.outputs.cache-hit != 'true'
        run: |
          cd openwrt-sdk
          make package/curl/compile -j$(nproc)

      - name: 编译 esurfingclient
        run: |
          cp -r esurfingclient openwrt-sdk/package/
          
          cd openwrt-sdk
          

          make package/esurfingclient/compile -j$(nproc)

          mapfile -t PKG_FILES < <(find bin/packages -type f -name "esurfingclient*.ipk")
          if [ "${#PKG_FILES[@]}" -eq 0 ]; then
            echo "❌ 未找到 esurfingclient IPK 构建产物"
            exit 1
          fi
          if [ "${#PKG_FILES[@]}" -gt 1 ]; then
            echo "❌ 找到多个 esurfingclient IPK 构建产物，拒绝覆盖："
            printf '%s\n' "${PKG_FILES[@]}"
            exit 1
          fi
          cp "${PKG_FILES[0]}" ../esurfingclient_${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.release }}_mediatek_filogic.ipk

      - name: 上传工件
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient_${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.release }}_mediatek_filogic-ipk
          path: esurfingclient_${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.release }}_mediatek_filogic.ipk
          retention-days: 30
